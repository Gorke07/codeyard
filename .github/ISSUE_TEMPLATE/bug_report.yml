name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do not file them here, use the private advisory link on the issue chooser (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Codeyard version
      description: "`codeyard --version` or the About dialog"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64 / Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal file, folder or settings snippet helps most.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Remote (SSH) or local, language server involved, screenshots, logs.
