name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Codeyard to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds you tried
  - type: textarea
    id: budget
    attributes:
      label: Cost
      description: Codeyard has memory and size budgets (docs/architecture.md). Mention anything that adds a dependency or a resident process.
