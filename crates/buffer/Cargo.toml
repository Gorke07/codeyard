[package]
name = "buffer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rope text buffer with cursors, selections and undo (no UI dependency)"
repository.workspace = true
publish = false

[dependencies]
# Line endings are only \n (form feed, U+2028 and a lone CR stay inside a line; files
# with CR are converted when read).
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
unicode-segmentation = "1.13.3"
