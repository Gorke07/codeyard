[package]
name = "schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JSON and YAML schema validation, hover and completion"
repository.workspace = true
publish = false

[dependencies]
serde_json = "1.0.154"
# HTTP/file resolution disabled: schemas are fetched through `Store` (cache, curl); no TLS stack is pulled in.
jsonschema = { version = "0.60.1", default-features = false }
yaml-rust2 = "0.13.0"
sha2 = "0.11.1"
